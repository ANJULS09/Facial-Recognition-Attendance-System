[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "facial-attendance"
dynamic = ["version"]
description = "Real-time webcam attendance system using OpenCV and face_recognition (dlib)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Anjul Shukla" }]
keywords = ["face-recognition", "attendance", "opencv", "dlib", "computer-vision"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Intended Audience :: Education",
]
dependencies = [
    "face_recognition>=1.3.0",
    "opencv-python>=4.8",
    "numpy>=1.24,<2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
face-attendance = "facial_attendance.cli:main"

[tool.setuptools.dynamic]
version = { attr = "facial_attendance.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
